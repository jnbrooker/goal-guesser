<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/style.css">
  <script>
    try { const t = localStorage.getItem("gg-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topnav">
    <a class="logo" href="#/" aria-label="Goal Guesser home">
      <span>GOAL</span><span>GUESSER</span>
    </a>
    <nav class="mainmenu">
      <a href="#/browse" data-nav="browse">Browse</a>
      <a href="#/learn" data-nav="learn">Learn</a>
      <a href="#/flashcards" data-nav="flashcards">Flashcards</a>

  <main id="main"><div class="empty">Loading…</div></main>
  <footer>
    Premier League goals only (penalties included, own goals excluded).
    Data: <a href="https://github.com/TimHoare/Premier_League_Data">TimHoare/Premier_League_Data</a> (1992/93–2019/20) and
    <a href="https://github.com/vaastav/Fantasy-Premier-League">vaastav/Fantasy-Premier-League</a> (2020/21 onwards).
